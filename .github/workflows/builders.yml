name: Builders

# The ROM is copyrighted, so CI cannot build the game. These jobs assemble
# self-contained builders (bundled Zig/CMake/Ninja/SDL2 + source) that ask the
# user for their own ROM and compile locally.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builders-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.14.1"
  CMAKE_VERSION: "4.3.4"
  NINJA_VERSION: "1.13.2"
  SDL2_VERSION: "2.28.5"

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxss-dev \
            libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev

      - name: Fetch bundled tools
        run: |
          set -euo pipefail
          mkdir -p dl toolchain/zig
          curl -fsSL -o dl/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar -xJf dl/zig.tar.xz -C dl
          cp -a "dl/zig-x86_64-linux-${ZIG_VERSION}/." toolchain/zig/
          curl -fsSL -o dl/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          tar -xzf dl/cmake.tar.gz -C dl
          mv "dl/cmake-${CMAKE_VERSION}-linux-x86_64" toolchain/cmake
          curl -fsSL -o dl/ninja.zip \
            "https://github.com/ninja-build/ninja/releases/download/v${NINJA_VERSION}/ninja-linux.zip"
          unzip -q dl/ninja.zip -d toolchain
          curl -fsSL -o dl/sdl2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          tar -xzf dl/sdl2.tar.gz -C dl

      - name: Build static SDL2
        run: |
          set -euo pipefail
          ./toolchain/cmake/bin/cmake -S "dl/SDL2-${SDL2_VERSION}" -B sdl2-build -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$PWD/toolchain/ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl2" \
            -DCMAKE_C_COMPILER="$PWD/toolchain/zig/zig" \
            -DCMAKE_C_COMPILER_ARG1=cc \
            -DCMAKE_CXX_COMPILER="$PWD/toolchain/zig/zig" \
            -DCMAKE_CXX_COMPILER_ARG1=c++ \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF
          ./toolchain/cmake/bin/cmake --build sdl2-build --parallel "$(nproc)"
          ./toolchain/cmake/bin/cmake --install sdl2-build

      - name: Assemble AppDir
        run: |
          set -euo pipefail
          mkdir -p AppDir
          git archive --format=tar.gz -o AppDir/source.tar.gz HEAD
          cp tools/builder/builder.cmake tools/builder/AppRun \
             tools/builder/README.md tools/builder/NOTICES.txt \
             tools/builder/jp3-builder.desktop tools/builder/jp3-builder.png AppDir/
          cp -a toolchain AppDir/toolchain
          cp tools/builder/zig-toolchain.cmake AppDir/toolchain/
          cp tools/builder/NINJA-COPYING.txt AppDir/toolchain/
          cp -a sdl2 AppDir/sdl2
          cp engine/runner/external/SDL2/SDL2-2.28.5/COPYING.txt AppDir/sdl2/
          chmod +x AppDir/AppRun

          # The payload must reject a missing ROM before doing any work.
          if printf '%s\n' /nonexistent/rom.md | AppDir/AppRun >badrom.log 2>&1; then
            echo "builder accepted a missing ROM" >&2
            exit 1
          fi
          grep -q 'ROM not found' badrom.log

      - name: Toolchain smoke test
        run: |
          set -euo pipefail
          mkdir -p /tmp/jp3src
          tar -xzf AppDir/source.tar.gz -C /tmp/jp3src
          # Configure without the ROM (allowed) and build the recompiler, so a
          # broken Zig/CMake/SDL2 combination fails here, not for a user.
          ./AppDir/toolchain/cmake/bin/cmake -S /tmp/jp3src -B /tmp/jp3cfg -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM="$PWD/AppDir/toolchain/ninja" \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/AppDir/toolchain/zig-toolchain.cmake" \
            -DSDL2_DIR="$PWD/AppDir/sdl2/lib/cmake/SDL2"
          ./AppDir/toolchain/cmake/bin/cmake --build /tmp/jp3cfg \
            --target GenesisRecomp --parallel "$(nproc)"

      - name: Build AppImage
        run: |
          set -euo pipefail
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool --no-appstream AppDir JP3-Builder-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: JP3-Builder-linux-x86_64
          path: JP3-Builder-x86_64.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Fetch bundled tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dl | Out-Null
          Invoke-WebRequest -Uri "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip" -OutFile dl/zig.zip
          Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v$env:CMAKE_VERSION/cmake-$env:CMAKE_VERSION-windows-x86_64.zip" -OutFile dl/cmake.zip
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v$env:NINJA_VERSION/ninja-win.zip" -OutFile dl/ninja.zip
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-devel-$env:SDL2_VERSION-mingw.tar.gz" -OutFile dl/sdl2.tar.gz
          & 7z x -y dl/zig.zip -odl | Out-Null
          & 7z x -y dl/cmake.zip -odl | Out-Null
          & 7z x -y dl/ninja.zip -odl | Out-Null
          tar -xzf dl/sdl2.tar.gz -C dl

      - name: Assemble payload
        run: |
          set -euo pipefail
          mkdir -p JP3-Builder/toolchain/zig JP3-Builder/toolchain/cmake JP3-Builder/sdl2
          cp -a "dl/zig-x86_64-windows-${ZIG_VERSION}/." JP3-Builder/toolchain/zig/
          cp -a "dl/cmake-${CMAKE_VERSION}-windows-x86_64/." JP3-Builder/toolchain/cmake/
          cp dl/ninja.exe JP3-Builder/toolchain/
          cp tools/builder/NINJA-COPYING.txt JP3-Builder/toolchain/
          cp tools/builder/zig-toolchain.cmake JP3-Builder/toolchain/
          cp -a "dl/SDL2-${SDL2_VERSION}/x86_64-w64-mingw32/." JP3-Builder/sdl2/
          cp engine/runner/external/SDL2/SDL2-2.28.5/COPYING.txt JP3-Builder/sdl2/
          cp tools/builder/builder.cmake tools/builder/README.md \
             tools/builder/NOTICES.txt JP3-Builder/
          git archive --format=tar.gz -o JP3-Builder/source.tar.gz HEAD
          ./JP3-Builder/toolchain/zig/zig.exe cc -target x86_64-windows-gnu \
            -municode -O2 tools/builder/launcher.c \
            -o "JP3-Builder/Build James Pond 3.exe"

      - name: Toolchain smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Get-Location).Path
          $builder = Join-Path $root "JP3-Builder"
          "|" | & "$builder\Build James Pond 3.exe" --help | Select-String "James Pond 3 builder"

          # The bundled compiler must produce a runnable native program.
          "int main(void){return 42;}" | Set-Content hello.c
          & "$builder\toolchain\zig\zig.exe" cc -O2 hello.c -o hello.exe
          & "$root\hello.exe"
          if ($LASTEXITCODE -ne 42) { throw "native compile/run failed" }

          # Configure the real source without the ROM and build the recompiler.
          New-Item -ItemType Directory -Force src | Out-Null
          tar -xzf "$builder\source.tar.gz" -C src
          & "$builder\toolchain\cmake\bin\cmake.exe" -S "$root\src" -B "$root\cfg" -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MAKE_PROGRAM="$builder\toolchain\ninja.exe" `
            -DCMAKE_TOOLCHAIN_FILE="$builder\toolchain\zig-toolchain.cmake" `
            -DSDL2_DIR="$builder\sdl2\lib\cmake\SDL2"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          & "$builder\toolchain\cmake\bin\cmake.exe" --build "$root\cfg" --target GenesisRecomp --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "recompiler build failed" }

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & 7z a -tzip -mx=6 JP3-Builder-Windows-x86_64.zip JP3-Builder | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "zip failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: JP3-Builder-windows-x86_64
          path: JP3-Builder-Windows-x86_64.zip
          if-no-files-found: error
