# Audited runtime-evidence entries. These are computed-call/state-table
# targets seen in dispatch_misses.toml / floor_coverage.toml while moving,
# jumping, and attacking in Garden of Edam. Kept late so they cannot
# recursively reopen heuristic discovery.
late_extra = [
    0x0B5AF4,   # BRA.W target in the $0B5AE6 VDP dispatcher table
    0x0B5AF8,   # BSR/BRA target in the same table (was a floor capsule)
    0x0B5AFC,   # BRA.W target in the same table
    0x0B5B00,   # VDP/scroll helper (dispatch miss)
    0x0A8016,   # JMP (A4) tilemap-blitter target
    0x0B5D54,   # VDP setup continuation reached by computed dispatch
    0x0B5DDC,   # VDP setup epilogue reached by computed dispatch
    0x0B72C8,   # main-loop entry reached by BRA from the state handlers
    0x0A8EFC,   # object-loop continuation: `pea` return target popped by rts
    # Camonbert Canyon enemy update handlers reached only through the object
    # behavior tables (the $0A9320 loop's `jsr (a5)`). Each is a real function
    # entry: the preceding word is RTS/BRA/JMP or data, never a fallthrough.
    # Without native bodies the tier-3 capsule declines them (its forced
    # continuation return never matches the native $0A9322 return), so the
    # enemies never move or take damage. Their internal `jmp (pc,d0.w)`
    # state ladders are given explicitly too, because the audited late phase
    # does not run speculative table discovery.
    0x0A9FC6,   # enemy handler, behavior pointer $0CB43C
    0x0AC402,   # enemy handler, behavior pointer $0CA9EC
    0x0AC41A,   # $0AC402 state ladder slot 0 (bra.w)
    0x0AC41E,   # $0AC402 state ladder slot 1 (bra.w)
    0x0AC2B6,   # enemy handler, behavior pointer $0CA9B0
    0x0AC2DA,   # $0AC2B6 state ladder slot 0 (bra.w)
    0x0AC2DE,   # $0AC2B6 state body reached by the slot 0 bra.w
    # Type $3D handler ($0AC524, listed above) pushes the $0AC53E
    # continuation then jumps through `jmp $ac542(pc,d0.w)`. Without these
    # slots the tier-3 capsule runs the ladder with the pushed longword as
    # its return, accepts it as balanced, and the native caller pops the
    # wrong slot — a 4-byte leak per frame that overwrites $FFFD10.
    0x0AC542,   # $0AC524 state ladder slot 0 (bra.w)
    0x0AC546,   # $0AC524 state ladder slot 1 (bra.b)
    0x0AC53E,   # $0AC524 `pea.l` continuation (jmp $0A94EE)
    # Type $4E handler ($0ACF76, slot 1's live object) pushes the $0ACF90
    # continuation then jumps through `jmp $acf94(pc,d0.w)`. Same failure as
    # $0AC524 above: the capsule ran the ladder and left the pushed longword
    # on the guest stack, leaking 4 bytes per frame until A7 overwrote the
    # $FFFD10 V-int trampoline.
    0x0ACF94,   # $0ACF76 state ladder slot 0 (bra.w)
    0x0ACF98,   # $0ACF76 state ladder slot 1 (bra.b)
    0x0ACF90,   # $0ACF76 `pea.l` continuation (jmp $0A94EE)
    0x0ABA46,   # enemy handler, behavior pointers $0CA2A8 / $0CA398
    0x0ABA6E,   # $0ABA46 state ladder slot 0 (bra.w)
    0x0ABA72,   # $0ABA46 state ladder slot 1 (bra.w)
    0x0ABA76,   # $0ABA46 state ladder slot 2 (bra.w)
    0x0AC076,   # enemy handler, behavior pointer $0CA884
    0x0AC08E,   # $0AC076 state ladder slot 0 (bra.w)
    0x0AC092,   # $0AC076 state ladder slot 1 (bra.w)
    0x0AB858,   # enemy handler, behavior pointer $0CA230
    0x0AB87A,   # $0AB858 state ladder slot 0 (bra.w)
    0x0AB87E,   # $0AB858 state ladder slot 1 (bra.w)
    0x0AB8EA,   # enemy handler, behavior pointer $0CA26C
    0x0AB910,   # $0AB8EA state ladder slot 0 (bra.w)
    0x0AB914,   # $0AB8EA state ladder slot 1 (bra.w)
    # Custard-monster handlers (behavior pointers $0CA17C / $0CA1B8) and
    # their `jmp (pc,d0.w)` state ladders. The tier-3 capsule declined
    # $0AB650 at load (its tail jmp $0A94EE never matches the native
    # $0A9322 return), leaving the type-4 objects frozen, intangible, and
