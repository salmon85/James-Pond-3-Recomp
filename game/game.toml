# game.toml — James Pond 3: Operation Starfish (Millennium / Electronic Arts, 1993)
# Sega Genesis / Mega Drive, USA+Europe dump.
#
# ROM identity (No-Intro "James Pond 3 (USA, Europe).md"):
#   size   2,097,152 bytes (2 MB)
#   CRC32  0x26F64B2A
#   SHA256 8f52e27945b96d6c37fda28c44d39d65d805cc0b58332f9b4a2eb26dff540d29
#   header "JAMES POND III", serial GM T-50646 -00, regions U/E/J
#
# Vector table is unusual (Sega's stock init code owns the first 1 KB):
#   $000000 SSP   = 0x00000000  (the 68K wraps to $FFFFFC on first push)
#   $000004 entry = 0x00000200  (Sega init: TMSS, VDP, Z80, RAM clear)
#   $000070 H-int = 0xFFFFFD0A  (RAM-installed trampoline)
#   $000078 V-int = 0xFFFFFD10  (RAM-installed trampoline)
# The init code jumps to the actual game entry at $001FDCBC.
#
# There is no community disassembly for this game. Discovery is the
# recompiler's heuristic (vector-table scan + BSR/JSR/RTS walk) with the
# validator-gated PC-relative jump-table walker enabled. The Tier-3
# interpreter floor is kept on for unresolved dynamic targets, and each run's
# dispatch_misses.toml / floor_coverage.toml feeds the audited function list.

[game]
output_prefix = "jp3"
jump_table_autodiscovery = true

[ram_layout]
# $FFFF2799 is clear on the map/overworld and $FF while a level is running.
# Save-state resume uses it to pick the loop that was actually executing.
game_mode      = 0xFFFF2799
vint_runcount  = 0x000000     # unknown
vint_routine   = 0x000000     # unknown
plc_pending    = 0x000000     # no Sonic-style PLC system
initial_ssp    = 0x00000000   # reset vector: 0 wraps to $FFFFFC on push
vbla_stack     = 0x00000000   # IRQ stack follows the same wrapped top-of-RAM
intr_stack     = 0x00000000
player_object  = 0x000000     # unknown
level_modes    = []

# Audited pre-instruction hook: $0B6D88 is an RTS used as a computed jump.
# The decompressor at $0B6D3E pushes the epilogue address $0B6DE6 with PEA and
# later RTSes into it. The generated split function would otherwise unwind as a
# normal return and skip the MOVEM restore/D0 result. The game adapter detects
# this site and performs the pop+tail dispatch explicitly.
[[widescreen_site]]
addr = 0x0B6D88
kind = "game_hook"

# The main decode loop ends with the same PEA-target RTS at $0B6DE4.
[[widescreen_site]]
addr = 0x0B6DE4
kind = "game_hook"

# The Z80 bus-request helper must not be interrupted between its request write
# and ACK poll: a V/H interrupt can run the matching release and leave the
# helper spinning forever. Mask interrupts for the helper's short body.
[[widescreen_site]]
addr = 0x0B6FA2
kind = "game_hook"

[[widescreen_site]]
addr = 0x0B6FB8
kind = "game_hook"

# The $0BD424 state dispatch indexes a 5-entry table. A corrupted FCF4 byte
# made it jump +2 bytes into instructions ($0BD524/$0BD618). Keep the computed
# offset inside the table; state 0 is the safe idle path.
[[widescreen_site]]
addr = 0x0BD424
kind = "game_hook"

[functions]
# Vector-table seeds are automatic; the game entry reached by the stock init
# routine's JSR is listed explicitly because it is the real main routine.
extra = [
    0x000200,   # reset vector: stock Sega init / loader
    0x1FDCBC,   # JSR target at $0002FA: game entry point
    0x0B5FF0,   # V-int body reached through the RAM trampoline at $FFFFFD10
    0x0B600E,   # H-int body (plain RTE) reached through $FFFFFD0A
    0x1FDC20,   # JSR target at the top of the V-int handler ($0B5FFE)
    0x0B6DE6,   # PEA-pushed epilogue of the $0B6D3E decompressor
    0x0C332C,   # later V-int handler installed into $FFFFFD12
    0x0C3390,   # later H-int handler installed into $FFFFFD0C
    0x0C3350,   # installer / helper used by the $0C3390 H-int path
    0x0C3348,   # VDP register helper in the $0C332C V-int cluster
    0x0C3378,   # scroll/VRAM helper called from both handlers
    0x0C339E,   # object/scroll state helper in the $0C3390 cluster
    0x09FA16,   # title/intro H-int handler installed into $FFFFFD0C
    0x09FA3C,   # H-int scroll setup helper called from $09FA16's cluster
    0x0A7F2E,   # static JMP (A4) target in the level tilemap blitter
    0x0A1E5E,   # steady-state frame-loop top; portable save resume point
]
# Audited runtime-evidence entries. These are computed-call/state-table
# targets seen in dispatch_misses.toml / floor_coverage.toml while moving,
# jumping, and attacking in Garden of Edam. Kept late so they cannot
# recursively reopen heuristic discovery.
late_extra = [
    0x0B5AF4,   # BRA.W target in the $0B5AE6 VDP dispatcher table
    0x0B5AF8,   # BSR/BRA target in the same table (was a floor capsule)
    0x0B5AFC,   # BRA.W target in the same table
    0x0B5B00,   # VDP/scroll helper (dispatch miss)
    0x0A8016,   # JMP (A4) tilemap-blitter target
    0x0B5D54,   # VDP setup continuation reached by computed dispatch
    0x0B5DDC,   # VDP setup epilogue reached by computed dispatch
    0x0B72C8,   # main-loop entry reached by BRA from the state handlers
    0x0A8EFC,   # object-loop continuation: `pea` return target popped by rts
    # Camonbert Canyon enemy update handlers reached only through the object
    # behavior tables (the $0A9320 loop's `jsr (a5)`). Each is a real function
    # entry: the preceding word is RTS/BRA/JMP or data, never a fallthrough.
    # Without native bodies the tier-3 capsule declines them (its forced
    # continuation return never matches the native $0A9322 return), so the
    # enemies never move or take damage. Their internal `jmp (pc,d0.w)`
    # state ladders are given explicitly too, because the audited late phase
    # does not run speculative table discovery.
    0x0A9FC6,   # enemy handler, behavior pointer $0CB43C
    0x0AC402,   # enemy handler, behavior pointer $0CA9EC
    0x0AC41A,   # $0AC402 state ladder slot 0 (bra.w)
    0x0AC41E,   # $0AC402 state ladder slot 1 (bra.w)
    0x0AC2B6,   # enemy handler, behavior pointer $0CA9B0
    0x0AC2DA,   # $0AC2B6 state ladder slot 0 (bra.w)
    0x0AC2DE,   # $0AC2B6 state body reached by the slot 0 bra.w
    0x0ABA46,   # enemy handler, behavior pointers $0CA2A8 / $0CA398
    0x0ABA6E,   # $0ABA46 state ladder slot 0 (bra.w)
    0x0ABA72,   # $0ABA46 state ladder slot 1 (bra.w)
    0x0ABA76,   # $0ABA46 state ladder slot 2 (bra.w)
    0x0AC076,   # enemy handler, behavior pointer $0CA884
    0x0AC08E,   # $0AC076 state ladder slot 0 (bra.w)
    0x0AC092,   # $0AC076 state ladder slot 1 (bra.w)
    0x0AB858,   # enemy handler, behavior pointer $0CA230
    0x0AB87A,   # $0AB858 state ladder slot 0 (bra.w)
    0x0AB87E,   # $0AB858 state ladder slot 1 (bra.w)
    0x0AB8EA,   # enemy handler, behavior pointer $0CA26C
    0x0AB910,   # $0AB8EA state ladder slot 0 (bra.w)
    0x0AB914,   # $0AB8EA state ladder slot 1 (bra.w)
    # Custard-monster handlers (behavior pointers $0CA17C / $0CA1B8) and
    # their `jmp (pc,d0.w)` state ladders. The tier-3 capsule declined
    # $0AB650 at load (its tail jmp $0A94EE never matches the native
    # $0A9322 return), leaving the type-4 objects frozen, intangible, and
    # harmless.
    0x0AB650,   # custard handler, behavior pointer $0CA17C
    0x0AB678,   # $0AB650 `jmp $ab678(pc,d0.w)` ladder base slot 0
    0x0AB67C,   # $0AB650 state ladder slot 1
    0x0AB680,   # $0AB650 state body 0 (bra.w target)
    0x0AB6BC,   # $0AB650 state body 1
    0x0AB66E,   # $0AB650 state body RTS target (pea.l $ab66e)
    0x0AB6D6,   # custard variant handler, behavior pointer $0CA1B8
    0x0AB704,   # $0AB6D6 `jmp $ab704(pc,d0.w)` ladder base slot 0
    0x0AB708,   # $0AB6D6 state ladder slot 1
    0x0AB70C,   # $0AB6D6 state ladder slot 2
    0x0AB710,   # $0AB6D6 state ladder slot 3
    0x0AB714,   # $0AB6D6 state ladder slot 4
    0x0AB718,   # $0AB6D6 state body 0 (rts)
    0x0AB71A,   # $0AB6D6 state body 1
    0x0AB750,   # $0AB6D6 state body 2
    0x0AB786,   # $0AB6D6 state body 3
    0x0AB7E2,   # $0AB6D6 state body 4
    0x0AB6F4,   # $0AB6D6 state body RTS target (pea.l $ab6f4)
    # Common projectile/enemy behavior entries and their jump-table targets,
    # seen as interior-label misses while fired apples and white orbs sat
    # still. Each target decodes to a real instruction, so promote it instead
    # of letting the tier-3 capsule run the handler.
    0x0ABB3A,   # $0CA318 behavior entry (projectile state)
    0x0ABBC2,   # $0CA354 behavior entry (projectile state)
    0x0AB854,   # `jmp $0A9484` trampoline entry used by projectile states
    0x0B0C64,   # collision/offset helper reached through a data pointer
    0x0A9494,   # $0A9490 state-ladder slot 0 (bra.w)
    # Charged-shot state pair reached from the $0C9E34 pointer table. The
    # tier-3 capsule declines $0A9ACC (its $0A8EFC continuation return never
    # matches the native $0A9322 return), leaving the shot frozen in the air
    # and blocking further fire until the slot is destroyed.
    0x0A9A6A,   # charged-shot state entry, pointer pair at $0C9E34
    0x0A9ACC,   # charged-shot state entry, pointer pair at $0C9E34
    0x0B76B8,   # $0B76B0 state-ladder slot 1 (bra.w)
]
# The $0BD496 object-update cluster produced runtime targets that decode to
# mid-instruction operands ($0BD4A8, $0BD524, $0BD528, $0BD618). They are return
# addresses/misaligned computed targets, NOT callable entries: promoting
# $0BD524 made the recompiler execute the $F836 operand as an opcode and abort.
# Leave them as declined floor misses until the dispatcher offset is fixed.
blacklist = []
