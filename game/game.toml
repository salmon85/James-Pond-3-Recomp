# mid-instruction operands ($0BD4A8, $0BD524, $0BD528, $0BD618). They are return
# addresses/misaligned computed targets, NOT callable entries: promoting
# $0BD524 made the recompiler execute the $F836 operand as an opcode and abort.
# Leave them as declined floor misses until the dispatcher offset is fixed.
blacklist = []
