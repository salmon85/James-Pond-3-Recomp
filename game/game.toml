    0x0ABE82,   # type $26-$34 (even), shared handler
    0x0ABF06,   # type $25
    0x0ABF6C,   # type $36
    0x0AC154,   # type $37
    0x0AC246,   # type $39
    0x0AC4B8,   # type $3C
    0x0AC524,   # type $3D
    0x0AC5DA,   # type $3E
    0x0AC5E2,   # type $3F, $4F
    0x0AC666,   # type $40, $D5
    0x0AC9AE,   # type $06
    0x0AC9C8,   # type $41
    0x0AC9DA,   # type $42
    0x0ACA8A,   # type $43
    0x0ACAAE,   # type $45
    0x0ACACE,   # type $44
    0x0ACAFE,   # type $46
    0x0ACB68,   # type $47
    0x0ACC04,   # type $49
    0x0ACCBC,   # type $4A
    0x0ACE92,   # type $4B
    0x0ACEAA,   # type $4C
    0x0ACF76,   # type $4E
    0x0AD02E,   # type $51
    0x0AD0F0,   # type $50
    0x0AD122,   # type $53
    0x0AD1E8,   # type $57
